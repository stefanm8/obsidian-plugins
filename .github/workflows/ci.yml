name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tomorrows-daily-note:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: tomorrows-daily-note
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tomorrows-daily-note/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tomorrows-daily-note
          path: |
            tomorrows-daily-note/main.js
            tomorrows-daily-note/manifest.json
          if-no-files-found: error
